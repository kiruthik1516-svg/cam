services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: facial_ops
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: '4gb'
    command: >
      postgres
      -c shared_buffers=8GB
      -c effective_cache_size=16GB
      -c maintenance_work_mem=2GB
      -c work_mem=128MB
      -c wal_buffers=64MB
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facial_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: facial_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: facial_backend
    shm_size: '12gb'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/facial_ops
      REDIS_URL: redis://redis:6379/0
      PORT: 1223
      CORS_ORIGINS: "*"
      SECRET_KEY: ${SECRET_KEY:-sentinel-secret-key-32-chars-min-length}
      EDGE_API_KEY: ${EDGE_API_KEY:-sentinel-edge-key-production-xyz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEBUG: "false"
      ENABLE_FORENSIC_SEARCH: "true"
      HOST_FOOTAGE_DIR: ./footage
      FOOTAGE_ROOTS: /footage,/app/data
      TZ: Asia/Kolkata
    volumes:
      - ./backend:/app/backend
      - ./facial_recognition:/app/facial_recognition
      - ./data:/app/data
      - ./footage:/footage:ro
    ports:
      - "1223:1223"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1223/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./facial-recognition-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:1223
        NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-localhost}:1223
    container_name: facial_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:1223
      NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-localhost}:1223
      NODE_ENV: production
      TZ: Asia/Kolkata
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local

